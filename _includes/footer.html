<footer class="site-footer">
  <div class="footer-content">
    <nav class="footer-nav" aria-label="Footer navigation">
      <ul class="footer-links">
        <li><a href="{{ '/' | relative_url }}">Home</a></li>
        <li><a href="{{ '/about' | relative_url }}">About</a></li>
        <li><a href="{{ '/writing' | relative_url }}">Writing</a></li>
        <li><a href="{{ '/contact' | relative_url }}">Contact</a></li>
      </ul>
    </nav>

    <div class="social-links">
      {% if site.author.linkedin %}
      <a href="https://www.linkedin.com/in/{{ site.author.linkedin }}" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">LinkedIn</a>
      {% endif %}
      {% if site.author.github %}
      <a href="https://github.com/{{ site.author.github }}" target="_blank" rel="noopener noreferrer" aria-label="GitHub">GitHub</a>
      {% endif %}
      {% if site.author.twitter %}
      <a href="https://twitter.com/{{ site.author.twitter }}" target="_blank" rel="noopener noreferrer" aria-label="Twitter">Twitter</a>
      {% endif %}
      {% if site.author.instagram %}
      <a href="https://www.instagram.com/{{ site.author.instagram }}" target="_blank" rel="noopener noreferrer" aria-label="Instagram">Instagram</a>
      {% endif %}
    </div>

    <p class="copyright">&copy; {{ 'now' | date: "%Y" }} {{ site.author.name }}</p>
  </div>
</footer>
